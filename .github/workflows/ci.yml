# Chạy khi đẩy lên main và với mọi pull request. Bốn job: backend, frontend (song song) -> e2e, docker (chạy sau khi hai job đầu qua).
name: CI
on:
  push: { branches: [main] }
  pull_request:
# Quyền tối thiểu (chỉ đọc mã); concurrency huỷ lần chạy cũ khi có commit mới trên cùng nhánh.
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  # Job 1: kiểm tra mã Python (lint, unit + integration, độ phủ) trên hai phiên bản Python.
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app scripts tests
      - run: pytest tests/unit tests/integration --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with: { name: coverage, path: coverage.xml }

  # Job 2: build giao diện; kết quả (frontend/dist) được lưu thành artifact cho job e2e.
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: frontend/dist }

  # Job 3: chạy server thật + trình duyệt Chromium trên bản giao diện đã build ở job 2.
  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt && playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: frontend/dist }
      - run: pytest tests/e2e

  # Job 4: build image và thử khởi động (smoke test): đợi tối đa 30 giây cho /health trả lời, lỗi thì in log container.
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reverse-chatbot:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 -e LLM_PROVIDER=mock -e EMBEDDING_PROVIDER=hashing reverse-chatbot:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs app; exit 1
