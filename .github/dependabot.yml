# Dependabot tự mở pull request khi có bản cập nhật: pip và npm hằng tuần, GitHub Actions và Docker hằng tháng.
version: 2
updates:
  - { package-ecosystem: pip, directory: "/", schedule: { interval: weekly } }
  - { package-ecosystem: npm, directory: "/frontend", schedule: { interval: weekly } }
  - { package-ecosystem: github-actions, directory: "/", schedule: { interval: monthly } }
  - { package-ecosystem: docker, directory: "/", schedule: { interval: monthly } }
